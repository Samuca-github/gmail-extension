<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Phishing Scanner</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #dc2626;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial;
        width: 360px;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h3 { margin: 0; font-size: 15px; }
      main { padding: 16px; }
      .hidden { display: none !important; }

      button {
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        border-radius: 6px;
        border: 1px solid transparent;
        padding: 8px 12px;
        transition: background .15s;
      }
      .btn-primary { background: var(--primary); color: #fff; width: 100%; padding: 10px 12px; }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-secondary { background: #fff; color: var(--fg); border-color: var(--border); }
      .btn-link { background: none; border: none; color: var(--muted); padding: 4px 6px; font-size: 12px; }
      .btn-link:hover { color: var(--danger); text-decoration: underline; }

      .user {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; background: #f9fafb; border-radius: 8px;
        margin-bottom: 12px;
      }
      .user img { width: 32px; height: 32px; border-radius: 50%; }
      .user .name { font-weight: 600; font-size: 13px; }
      .user .email { color: var(--muted); font-size: 11px; }

      .status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
      .error { color: var(--danger); }

      .result-card {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge.phishing { background: #fee2e2; color: #991b1b; }
      .badge.suspicious { background: #fef3c7; color: #92400e; }
      .badge.benign { background: #dcfce7; color: #166534; }
      .badge.tag {
        background: #eef2ff; color: #3730a3;
        font-weight: 500; text-transform: none;
        margin: 2px 4px 0 0;
      }
      .badge.source {
        background: #f3f4f6; color: #4b5563;
        font-weight: 500; text-transform: none;
        font-size: 10px; margin-left: 6px;
      }
      pre {
        white-space: pre-wrap; word-break: break-word;
        background: #f6f8fa; padding: 8px; border-radius: 6px;
        font-size: 11px; max-height: 160px; overflow: auto;
      }
      .alert-warning {
        margin-top: 10px; padding: 8px 10px;
        background: #fffbeb; border: 1px solid #fcd34d;
        border-radius: 6px; font-size: 12px; color: #92400e;
      }
      .alert-danger {
        margin-top: 10px; padding: 10px;
        background: #fef2f2; border: 1px solid #fecaca;
        border-radius: 6px; font-size: 12px; color: #991b1b;
        font-weight: 500;
      }
      .explanations {
        margin: 8px 0 0 18px; padding: 0; font-size: 12px;
      }
      .explanations li { margin-bottom: 3px; }
      .breakdown-row {
        display: flex; justify-content: space-between;
        padding: 3px 0; font-size: 11px; color: #4b5563;
      }
      .breakdown-row .k { font-weight: 500; }
      .meter {
        height: 6px; background: #e5e7eb; border-radius: 3px;
        margin-top: 4px; overflow: hidden;
      }
      .meter-fill { height: 100%; transition: width .3s; }
      .meter-fill.low { background: #16a34a; }
      .meter-fill.med { background: #f59e0b; }
      .meter-fill.high { background: #dc2626; }

      .login-card { text-align: center; padding: 8px 0 4px; }
      .login-card p { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
      .auth-email { text-align: left; }
      .auth-email label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
      .auth-email input {
        width: 100%; padding: 8px 10px; border: 1px solid var(--border);
        border-radius: 6px; font-size: 13px; margin-bottom: 10px; box-sizing: border-box;
      }
      .auth-email input:focus { outline: 2px solid rgba(37, 99, 235, 0.25); border-color: var(--primary); }
      .auth-email .row { display: flex; gap: 8px; margin-top: 4px; }
      .auth-email .row button { flex: 1; padding: 9px 8px; font-size: 12px; }
      .auth-hint { font-size: 10px; color: var(--muted); margin-top: 10px; line-height: 1.45; text-align: left; }
    </style>
  </head>
  <body>
    <header>
      <h3>Phishing Scanner</h3>
      <button id="logoutBtn" class="btn-link hidden">Sair</button>
    </header>

    <main>
      <section id="loginView" class="hidden">
        <div class="login-card">
          <p>Entre com e-mail e senha.</p>
          <div class="auth-email">
            <label for="authEmail">E-mail</label>
            <input id="authEmail" type="email" autocomplete="username" spellcheck="false" />
            <label for="authPassword">Senha</label>
            <input id="authPassword" type="password" autocomplete="current-password" />
            <div class="row">
              <button type="button" id="emailLoginBtn" class="btn-primary">Entrar</button>
              <button type="button" id="emailSignupBtn" class="btn-secondary">Criar conta</button>
            </div>
          </div>          
          <div id="loginStatus" class="status"></div>
        </div>
      </section>

      <section id="appView" class="hidden">
        <div class="user">
          <img id="userAvatar" src="" alt="" />
          <div>
            <div id="userName" class="name"></div>
            <div id="userEmail" class="email"></div>
          </div>
        </div>

        <button id="analyzeBtn" class="btn-primary">Analisar e-mail aberto</button>
        <div id="status" class="status"></div>
        <div id="out"></div>
      </section>

      <section id="loadingView">
        <div class="status">Carregando...</div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
