<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Phishing Scanner</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #dc2626;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial;
        width: 360px;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h3 { margin: 0; font-size: 15px; }
      main { padding: 16px; }
      .hidden { display: none !important; }

      button {
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        border-radius: 6px;
        border: 1px solid transparent;
        padding: 8px 12px;
        transition: background .15s;
      }
      .btn-primary { background: var(--primary); color: #fff; width: 100%; padding: 10px 12px; }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-secondary { background: #fff; color: var(--fg); border-color: var(--border); }
      .btn-link { background: none; border: none; color: var(--muted); padding: 4px 6px; font-size: 12px; }
      .btn-link:hover { color: var(--danger); text-decoration: underline; }

      .user {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; background: #f9fafb; border-radius: 8px;
        margin-bottom: 12px;
      }
      .user img { width: 32px; height: 32px; border-radius: 50%; }
      .user .name { font-weight: 600; font-size: 13px; }
      .user .email { color: var(--muted); font-size: 11px; }

      .status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
      .error { color: var(--danger); }

      .result-card {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge.phishing { background: #fee2e2; color: #991b1b; }
      .badge.suspicious { background: #fef3c7; color: #92400e; }
      .badge.benign { background: #dcfce7; color: #166534; }
      .badge.tag {
        background: #eef2ff; color: #3730a3;
        font-weight: 500; text-transform: none;
        margin: 2px 4px 0 0;
      }
      .badge.source {
        background: #f3f4f6; color: #4b5563;
        font-weight: 500; text-transform: none;
        font-size: 10px; margin-left: 6px;
      }
      pre {
        white-space: pre-wrap; word-break: break-word;
        background: #f6f8fa; padding: 8px; border-radius: 6px;
        font-size: 11px; max-height: 160px; overflow: auto;
      }
      .alert-warning {
        margin-top: 10px; padding: 8px 10px;
        background: #fffbeb; border: 1px solid #fcd34d;
        border-radius: 6px; font-size: 12px; color: #92400e;
      }
      .alert-danger {
        margin-top: 10px; padding: 10px;
        background: #fef2f2; border: 1px solid #fecaca;
        border-radius: 6px; font-size: 12px; color: #991b1b;
        font-weight: 500;
      }
      .explanations {
        margin: 8px 0 0 18px; padding: 0; font-size: 12px;
      }
      .explanations li { margin-bottom: 3px; }
      .breakdown-row {
        display: flex; justify-content: space-between;
        padding: 3px 0; font-size: 11px; color: #4b5563;
      }
      .breakdown-row .k { font-weight: 500; }
      .meter {
        height: 6px; background: #e5e7eb; border-radius: 3px;
        margin-top: 4px; overflow: hidden;
      }
      .meter-fill { height: 100%; transition: width .3s; }
      .meter-fill.low { background: #16a34a; }
      .meter-fill.med { background: #f59e0b; }
      .meter-fill.high { background: #dc2626; }

      .login-card { text-align: center; padding: 8px 0 4px; }
      .login-card p { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
      .google-icon { width: 16px; height: 16px; vertical-align: middle; margin-right: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h3>Phishing Scanner</h3>
      <button id="logoutBtn" class="btn-link hidden">Sair</button>
    </header>

    <main>
      <!-- Tela de login -->
      <section id="loginView" class="hidden">
        <div class="login-card">
          <p>Entre com sua conta Google para analisar e-mails do Gmail.</p>
          <button id="loginBtn" class="btn-primary">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#fff" d="M21.35 11.1H12v3.2h5.35c-.23 1.4-1.66 4.1-5.35 4.1A6.4 6.4 0 1 1 12 5.6c1.82 0 3.04.78 3.74 1.45l2.55-2.46C16.7 3.13 14.55 2.2 12 2.2 6.5 2.2 2.05 6.65 2.05 12.15S6.5 22.1 12 22.1c6.92 0 9.5-4.86 9.5-9.05 0-.6-.06-1.07-.15-1.95Z"/>
            </svg>
            Entrar com Google
          </button>
          <div id="loginStatus" class="status"></div>
          <details style="margin-top:14px; text-align:left; font-size:11px; color:#6b7280">
            <summary style="cursor:pointer">Configuracao OAuth</summary>
            <!-- <div style="margin-top:8px">
              Redirect URI desta extensao:
              <pre id="redirectUriBox" style="margin-top:4px; user-select:all; cursor:text">carregando...</pre>
              Cole esse valor em <em>Authorized redirect URIs</em> do seu OAuth Web Client no Google Cloud Console.
            </div> -->
            <label for="googleClientIdInput" style="display:block; margin-top:12px">
              Client ID OAuth (Web) — salvo neste navegador
            </label>
            <input
              id="googleClientIdInput"
              type="text"
              placeholder="vazio = usar valor de config.js"
              style="width:100%; margin-top:4px; font-size:11px; padding:6px; box-sizing:border-box"
              autocomplete="off"
              spellcheck="false"
            />
            <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap">
              <button type="button" id="saveClientIdBtn" class="btn-secondary" style="flex:1; min-width:120px; font-size:11px; padding:6px">
                Salvar
              </button>
              <button type="button" id="clearClientIdBtn" class="btn-secondary" style="font-size:11px; padding:6px">
                Limpar (voltar ao config.js)
              </button>
            </div>
            <div id="clientIdHint" style="margin-top:6px; font-size:10px; color:#6b7280; line-height:1.35"></div>
            <div id="clientIdSaveStatus" class="status" style="margin-top:4px; min-height:14px; font-size:11px"></div>
          </details>
        </div>
      </section>

      <!-- Tela autenticada -->
      <section id="appView" class="hidden">
        <div class="user">
          <img id="userAvatar" src="" alt="" />
          <div>
            <div id="userName" class="name"></div>
            <div id="userEmail" class="email"></div>
          </div>
        </div>

        <button id="analyzeBtn" class="btn-primary">Analisar e-mail aberto</button>
        <div id="status" class="status"></div>
        <div id="out"></div>
      </section>

      <!-- Loading inicial -->
      <section id="loadingView">
        <div class="status">Carregando...</div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
